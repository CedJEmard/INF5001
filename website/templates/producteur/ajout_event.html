


{% extends "base_template/connectProd.html" %} {% block title %}Accueil{% endblock %} {% block
    content %}

    <link rel="stylesheet" type="text/css" href="../static/css/accueil_prod.css">
 <div class="prod">
    <div class="titre">Bienvenue {{user.name}}</div>
   
	        <input name="table" type="checkbox" id="chk" aria-hidden="true">
	        <input name="table" type="checkbox" id="chk2" aria-hidden="true">
	        <input name="table" type="checkbox" id="chk3" aria-hidden="true">  
            <input name="table" type="checkbox" id="chk4" aria-hidden="true">  

		<label for="chk" aria-hidden="true">Événement</label>
        <div class="prod plus">
            
        <form method="POST" enctype="multipart/form-data" type="sign" id="sign" name="sign" >
		<input 
				type="text" 
				id="name"
				name="name"
				placeholder="Nom de l'evenement*"
				required="">

		<input	class="description"
        id="description"
        name="description"
        type="text" 
        placeholder="Description de l'événement">
        
        <input type="file"  action="http://localhost:5000/upload"  id="file" name="file" placeholder="Logo" required="">
        
        
        <select data-trigger="" id="categorie" name="categorie">
            <option placeholder="">Catégorie</option>
            <option>Concerts</option>
            <option>Sport</option>
            <option>Humour</option>
            <option>Festivals</option>
            <option>Theatre</option>
            <option>Divers</option>
          </select>
    
        
		<input	class="date"
        id="date"
        name="date"
        type="date" 
        placeholder="Date debut de l'evenement"
        required=""
        >
        
		<input	class="date2"
        id="date2"
        name="date2"
        type="date" 
        placeholder="Date Fin de l'evenement"
        required="">
	</div>
	
    
		<label class="adress" for="chk" aria-hidden="true">Adresse</label>
<div class="adresse prod">
    <input	class="no1"
    id="noCivique"
    name="noCivique"
    type="text" 
    placeholder="# Civique">
<input	class="rue1"
    id="rue"
    name="rue"
    type="text" 
    placeholder="Rue">
<input class="codePostal1"
    id="codePostal"
    name="codePostal"
    type="text" 
    placeholder="Code Postal">
<input class="ville1"
    id="ville"
    name="ville"
    type="text" 
    placeholder="Ville"
    required="">
</div>
        
		<label class="mdp" for="chk2" aria-hidden="true">Billets</label>
		<div class="mdp2 prod">
		<input
				for="nbBillet" 
				id="nbBillet"
				name="nbBillet"
				type="number" 
				placeholder="Nombre de billet"
				required="">
		<input
				for="prixBillet" 
				id="prixBillet"
				name="prixBillet"
				type="number" 
				placeholder="Prix ($)"
				required="">
            </div>
				<button class="mdp3" for="sign" type="submit" class="btn btn-primary">S'enregistrer</button>	
			</form>

</div>
</div>

    {% endblock %}

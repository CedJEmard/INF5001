


{% extends "base_template/base.html" %} {% block title %}Enregistrement - Entreprise{% endblock %} {% block
	content %}
<link rel="stylesheet" type="text/css" href="../../static/css/sign_upForm.css">
	
<div class="main">  	
<input name="table" type="radio" id="chk" aria-hidden="true">
<input name="table" type="radio" id="chk2" aria-hidden="true">
<input name="table" type="radio"  id="chk3" aria-hidden="true">
<div class="signup">
	<form method="POST" type="sign" id="sign" name="sign">

		<label for="chk3" aria-hidden="true">S'enregistrer</label>
		<br><br>
		<input class="a1"
				id="email"
				type="email" 
				name="email" 
				placeholder="Courriel*"
				required="">
		<input class="a1"
				type="text" 
				id="name"
				name="name"
				placeholder="Nom de l'entreprise*"
				required="">
		<input  class="a1"
				id="telephone"
				name="telephone"
				type="text" 
				placeholder="Telephone (XXX)XXX-XXXX">
	</div>
	
<div class="adresse">

		<label class="adress" for="chk" aria-hidden="true">Entreprise</label>
		<input	class="NEQ-a1"
				id="NEQ"
				name="NEQ"
				type="text" 
				require=""
				placeholder="Numéros d'entreprise du Québec*">

		<input	class="description"
				id="description"
				name="description"
				type="text" 
				placeholder="Description de l'entreprise">
		
		</div>
		<div class="mdp">
				<label class="mdpchk" for="chk2" aria-hidden="true">Mot de passe</label>
		<input class="a1"
				for="password" 
				id="password"
				name="password"
				type="password" 
				placeholder="Mot de passe* (au moins 7 caractères)"
				required="">
		<input class="a1"
				for="password" 
				id="password2"
				name="password2"
				type="password" 
				placeholder="Confirmer mot de passe*"
				required="">
			
				<button for="sign" type="submit" class="btn btn-primary">S'enregistrer</button>	
			</form>
	</div>
</div>
	{% endblock %}

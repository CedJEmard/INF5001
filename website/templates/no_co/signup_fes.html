


	{% extends "base_template/base.html" %} {% block title %}Enregistrement - Festivalier{% endblock %} {% block
		content %}
<link rel="stylesheet" type="text/css" href="../static/css/sign_upForm.css">
		
<div class="main">  	
	<input name="table" type="radio" id="chk" aria-hidden="true">
	<input name="table" type="radio" id="chk2" aria-hidden="true">
	<input name="table" type="radio"  id="chk3" aria-hidden="true">
	<div class="signup">
		<form method="POST" type="signfes" id="signfes" name="signfes">

			<label for="chk3" aria-hidden="true">S'enregistrer</label><br><br>
			<input  class="a1"
					id="festivalier_email"
					type="email" 
					name="festivalier_email" 
					placeholder="Courriel*"
					required="">
			<input class="a1"
					type="text"
					class="form-control"
					id="festivalier_prenom"
					name="festivalier_prenom"
					placeholder="Prenom*"
					required="">
			<input class="a1"
					type="text" 
					id="festivalier_name"
					name="festivalier_name"
					placeholder="Nom*"
					required="">
			<input class="a1"
					id="festivalier_telephone"
					name="festivalier_telephone"
					type="text" 
					placeholder="Telephone (XXX)XXX-XXXX">
		</div>
		
	<div class="adresse">

			<label class="adress" for="chk" aria-hidden="true">Adresse</label>
			<div class="2">
			<input	class="no1-a1"
					id="noCivique"
					name="noCivique"
					type="text" 
					placeholder="# Civique">
			<input	class="rue1-a1"
					id="rue"
					name="rue"
					type="text" 
					placeholder="Rue">
			</div>
			<div class="2">
			<input class="codePostal1-a1"
					id="codePostal"
					name="codePostal"
					type="text" 
					placeholder="Code Postal">
			<input class="ville1-a1"
					id="ville"
					name="ville"
					type="text" 
					placeholder="Ville"
					required="">
			</div>
			<input class="a1"
					for="province" 
					id="province"
					name="province"
					type="text" 
					placeholder="Province"
					required="">
			<input class="a1"
					for="pays" 
					id="pays"
					name="pays"
					type="text" 
					placeholder="Pays"
					required="">
			

			</div>
			<div class="mdp">
					<label class="mdpchk" for="chk2" aria-hidden="true">Mot de passe</label>
			<input class="a1"
					for="festivalier_password" 
					id="festivalier_password"
					name="festivalier_password"
					type="password" 
					placeholder="Mot de passe* (au moins 7 caractères)"
					required="">
			<input class="a1"
					for="festivalier_password" 
					id="password2"
					name="password2"
					type="password" 
					placeholder="Confirmer mot de passe*"
					required="">
				
					<button for="signfes" type="submit" class="btn btn-primary">S'enregistrer</button>	
				</form>
		</div>
	</div>
		{% endblock %}
